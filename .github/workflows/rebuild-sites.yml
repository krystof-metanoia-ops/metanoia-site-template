# Rebuild every client site when the template's "stable" branch changes.
# Each client site has a Netlify build hook (a private URL that starts a build). They are stored,
# one per line, in the repository secret SITE_BUILD_HOOKS, never in this file: anyone holding a
# hook URL can trigger builds. A site whose build fails keeps its last good version live.
name: Rebuild client sites
on:
  push:
    branches: [stable]
  workflow_dispatch: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Call each site's build hook
        env:
          HOOKS: ${{ secrets.SITE_BUILD_HOOKS }}
        run: |
          if [ -z "$HOOKS" ]; then echo "No SITE_BUILD_HOOKS secret set; nothing to rebuild."; exit 0; fi
          n=0
          while IFS= read -r hook; do
            [ -z "$hook" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{}' "$hook")
            n=$((n+1)); echo "site $n: HTTP $code"
          done <<< "$HOOKS"
